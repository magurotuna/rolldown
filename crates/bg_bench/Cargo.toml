[package]
name = "bg_bench"
version = "0.1.0"
publish = false
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true

# Perf investigation harness (perf/bun-gap): runs one in-process build with the same
# runtime setup as rolldown_binding (tokio workers = physical*3/2, max_blocking = 4, mimalloc v3).

[[bin]]
name = "bg_bench"
path = "src/main.rs"
test = false
doctest = false

[dependencies]
mimalloc-safe = { workspace = true, features = ["skip_collect_on_exit", "v3"] }
num_cpus = { workspace = true }
rolldown = { workspace = true, features = ["experimental"] }
rolldown_common = { workspace = true, features = ["deserialize_bundler_options"] }
rolldown_utils = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
